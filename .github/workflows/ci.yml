name: CI

on:
  push:
    tags: ['v*']
  pull_request:

# A squash-merged PR was already built green on the branch, and a v* tag points at
# a commit that PR run covered. Building `main` too meant the same tree paid for a
# third 30-minute Windows run, so the merge push is deliberately not a trigger.
permissions:
  contents: read

concurrency:
  # Superseded PR pushes are worth cancelling. A tag run is not: it is the only run
  # that produces the installer and publishes the release.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "const pkg = require('./package.json'); if (process.env.GITHUB_REF_NAME !== 'v' + pkg.version) throw new Error('Release tag must match package version v' + pkg.version)"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Electron end-to-end tests
        run: npm run test:e2e

      # A failed E2E run only prints the assertion; the page snapshot Playwright
      # writes beside it is what shows the terminal state behind the failure.
      - name: Upload end-to-end failure context
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-failure-context
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      # P8: the RELEASE.md perf criterion, measured. Runs after the build so a
      # broken tree fails faster, and before packaging so a regression never
      # reaches an installer. A hosted runner is slower than a dev machine, so
      # the threshold is a ceiling, not a benchmark.
      - name: Performance smoke
        run: npm run test:perf

      - name: Package Windows application
        run: npm run build:win

      - name: Upload Windows package
        uses: actions/upload-artifact@v5
        with:
          name: elena-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: elena-windows
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          generate_release_notes: true
