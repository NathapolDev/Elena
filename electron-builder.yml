appId: dev.elena.app
productName: Elena
copyright: Copyright © 2026
directories:
  output: release
  buildResources: build
npmRebuild: false
files:
  - out/**
  - package.json
# node-pty ships N-API prebuilds, so it is unpacked rather than rebuilt.
asarUnpack:
  - '**/node_modules/node-pty/**'
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  # Registers the Explorer "Open in Elena" verb; removed again on uninstall.
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: NathapolDev
  repo: Elena
  channel: latest
  releaseType: release
